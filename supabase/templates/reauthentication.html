<!-- 재인증 코드 메일. 비밀번호 변경 때 reauthenticate()가 보낸다. supabase/config.toml의 auth.email.template.reauthentication이 쓴다 -->
<!doctype html>
<html lang="ko">
  <body style="margin:0;padding:0;background:#fbfaf8;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1d1c1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbfaf8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e9e7e2;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 24px;font-size:14px;font-weight:600;color:#4b5bd6;">작업 공간</p>
                <h1 style="margin:0 0 12px;font-size:20px;line-height:1.4;font-weight:600;color:#1d1c1a;">인증 코드</h1>
                <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#1d1c1a;">비밀번호를 바꾸려면 설정 화면에 아래 인증 코드를 입력하세요.</p>
                <p style="margin:0 0 8px;padding:16px;background:#f6f5f2;border-radius:8px;text-align:center;font-size:28px;font-weight:600;letter-spacing:6px;color:#1d1c1a;">{{ .Token }}</p>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#6b6760;">이 코드는 1시간 동안 유효합니다. 요청한 적이 없다면 다른 사람이 계정에 로그인했을 수 있으니 비밀번호를 바꿔 주세요.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
