<!-- 비밀번호 재설정 메일. supabase/config.toml의 auth.email.template.recovery가 쓴다 -->
<!doctype html>
<html lang="ko">
  <body style="margin:0;padding:0;background:#fbfaf8;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1d1c1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbfaf8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e9e7e2;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 24px;font-size:14px;font-weight:600;color:#4b5bd6;">작업 공간</p>
                <h1 style="margin:0 0 12px;font-size:20px;line-height:1.4;font-weight:600;color:#1d1c1a;">비밀번호를 다시 설정하세요</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#1d1c1a;">작업 공간 계정의 비밀번호 재설정을 요청하셨습니다. 아래 버튼을 눌러 새 비밀번호를 정하세요.</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset" style="display:inline-block;padding:10px 20px;background:#4b5bd6;border-radius:8px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;">비밀번호 재설정하기</a>
                </p>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#6b6760;">버튼이 열리지 않으면 아래 주소를 브라우저에 붙여 넣으세요.<br /><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset" style="color:#4b5bd6;word-break:break-all;">{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset</a></p>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#6b6760;">이 링크는 1시간 동안 유효합니다. 요청한 적이 없다면 이 메일을 무시하세요. 비밀번호는 바뀌지 않습니다.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
